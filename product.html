<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mila | Product</title>


    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <!-- Product CSS -->

    <link rel="stylesheet" href="product.css">

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar mila-navbar">

        <div class="container-fluid">


            <!-- Logo -->

            <a href="index.html" class="mila-logo">
                mila.
            </a>


            <!-- Navigation -->

            <div class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="products.html?category=makeup">
                    Makeup
                </a>

                <a href="about.html">
                    About
                </a>

                <a href="contact.html">
                    Contact
                </a>

            </div>


            <!-- Cart -->

            <a href="cart.html" class="cart-link">

                <span class="cart-icon">
                    🛍
                </span>

                <span>
                    Cart
                </span>

                <span class="cart-count">
                    0
                </span>

            </a>

        </div>

    </nav>



    <!-- ================= PRODUCT DETAILS ================= -->

    <main class="product-page">


        <div class="product-details">


            <!-- PRODUCT IMAGE -->

            <div class="product-detail-image">

                <img
                    id="product-image"
                    src=""
                    alt="Product"
                >

            </div>



            <!-- PRODUCT INFORMATION -->

            <div class="product-detail-info">


                <p
                    id="product-category"
                    class="product-category">
                </p>


                <h1 id="product-name">
                    Product Name
                </h1>


                <p
                    id="product-price"
                    class="product-price">
                </p>


                <div class="product-line"></div>


                <h3>
                    Description
                </h3>


                <p
                    id="product-description"
                    class="product-description">
                </p>



                <!-- QUANTITY -->

                <div class="quantity-section">

                    <p>
                        Quantity
                    </p>

                    <div class="quantity-control">

                        <button id="decrease-btn">
                            −
                        </button>

                        <span id="quantity">
                            1
                        </span>

                        <button id="increase-btn">
                            +
                        </button>

                    </div>

                </div>



                <!-- ADD TO CART -->

                <button
                    id="add-to-cart"
                    class="add-cart-main">

                    Add to Cart

                </button>


            </div>

        </div>

    </main>



    <!-- ================= JAVASCRIPT ================= -->

    <script src="product.js"></script>


</body>

</html>
