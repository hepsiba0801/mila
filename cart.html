<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mila | Cart</title>


    <!-- ================= BOOTSTRAP ================= -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">


    <!-- ================= CART CSS ================= -->

    <link rel="stylesheet" href="cart.css">

</head>


<body>


    <!-- ================= NAVBAR ================= -->

    <nav class="navbar mila-navbar">

        <div class="container-fluid">


            <!-- LOGO -->

            <a href="index.html" class="mila-logo">
                mila
            </a>


            <!-- NAV LINKS -->

            <div class="nav-links">

                <a href="index.html">
                    Home
                </a>

                <a href="products.html">
                    Shop
                </a>

                <a href="about.html">
                    About
                </a>

                <a href="contact.html">
                    Contact
                </a>

            </div>


            <!-- CART -->

            <a href="cart.html" class="cart-link">

                <span class="cart-icon">
                    🛍
                </span>

                <span>
                    Cart
                </span>

                <span class="cart-count">
                    0
                </span>

            </a>

        </div>

    </nav>



    <!-- ================= CART PAGE ================= -->

    <main class="cart-page">


        <!-- ================= HEADER ================= -->

        <section class="cart-header">

            <p class="cart-small-title">
                MILA COSMETICS
            </p>

            <h1>
                Your Cart
            </h1>

            <p>
                Review your beauty picks before checkout.
            </p>

        </section>



        <!-- ================= CART CONTENT ================= -->

        <section class="cart-container">


            <!-- ================= CART ITEMS ================= -->

            <div class="cart-items">

                <div id="cart-items-container">

                    <!-- Products will be inserted here -->

                </div>

            </div>



            <!-- ================= CART SUMMARY ================= -->

            <div class="cart-summary">

                <h2>
                    Order Summary
                </h2>


                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <span id="cart-subtotal">
                        ₹0
                    </span>

                </div>


                <div class="summary-row">

                    <span>
                        Delivery
                    </span>

                    <span>
                        FREE
                    </span>

                </div>


                <div class="summary-divider"></div>


                <div class="summary-total">

                    <span>
                        Total
                    </span>

                    <span id="cart-total">
                        ₹0
                    </span>

                </div>


                <button class="checkout-btn">

                    PROCEED TO CHECKOUT

                </button>


                <a
                    href="products.html"
                    class="continue-shopping">

                    ← Continue Shopping

                </a>

            </div>

        </section>


    </main>



    <!-- ================= CART JAVASCRIPT ================= -->

    <script src="cart.js"></script>

</body>

</html>
