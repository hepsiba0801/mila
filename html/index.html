<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mila | Cosmetics & Beauty</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- ================= SPLASH SCREEN ================= -->

    <div id="splash-screen">
        <img
            src="../images/logo.png"
            id="logo"
            alt="Mila Cosmetics Logo">
    </div>


    <!-- ================= HOME PAGE ================= -->

    <div id="home-page">

        <!-- ================= NAVBAR ================= -->

        <nav class="navbar mila-navbar">

            <div class="container-fluid">

                <!-- MILA LOGO -->
                <a href="index.html" class="mila-logo">
                    mila
                </a>

                <!-- NAVIGATION LINKS -->
                <div class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="products.html">Shop</a>
                    <a href="about.html">About</a>
                    <a href="contact.html">Contact</a>
                </div>

                <!-- ACCOUNT AND CART -->
                <div class="nav-actions">

                    <!-- ACCOUNT ICON -->
                    <a
                        href="signin.html"
                        class="account-link"
                        aria-label="My Account"
                        title="My Account">

                        <img
                            src="../images/avatar.png"
                            alt=""
                            class="navbar-icon">

                    </a>

                    <!-- CART ICON -->
                    <a href="cart.html" class="cart-link">
                        <span class="cart-icon" aria-hidden="true">🛍</span>
                        <span class="cart-label">CART</span>
                        <span class="cart-count">0</span>
                    </a>

                </div>

            </div>

        </nav>


        <!-- ================= HERO SECTION ================= -->

        <section class="hero-section">

            <!-- LEFT SIDE: CONTENT -->
            <div class="hero-content">

                <p class="hero-small-title">
                    MILA COSMETICS
                </p>

                <h1>
                    YOUR BEAUTY,<br>
                    YOUR WAY.
                </h1>

                <p class="hero-description">
                    Discover makeup made to bring out
                    your everyday glow.
                </p>

                <button
                    class="shop-btn"
                    onclick="window.location.href='products.html'">

                    SHOP NOW

                </button>

            </div>

            <!-- RIGHT SIDE: IMAGE -->
            <div class="hero-image">

                <img
                    src="../images/hero.jpeg"
                    alt="Mila Cosmetics">

            </div>

        </section>

    </div>


    <!-- ================= TOP CATEGORIES ================= -->

    <section class="categories-section">

        <!-- CATEGORIES HEADER -->
        <div class="categories-header">

            <h2>Top Categories</h2>

            <a href="products.html" class="view-all">
                View All →
            </a>

        </div>

        <!-- CATEGORIES CONTAINER -->
        <div class="categories-container">

            <!-- MAKEUP -->
            <div class="category-card" data-category="makeup">

                <img src="../images/makeup.jpeg" alt="Makeup">

                <p>Makeup</p>

            </div>

            <!-- SKINCARE -->
            <div class="category-card" data-category="skincare">

                <img src="../images/skincare.jpeg" alt="Skincare">

                <p>Skincare</p>

            </div>

            <!-- HAIR -->
            <div class="category-card" data-category="hair">

                <img src="../images/hair.jpeg" alt="Hair Care">

                <p>Hair</p>

            </div>

            <!-- FRAGRANCE -->
            <div class="category-card" data-category="fragrance">

                <img src="../images/perfume.jpeg" alt="Fragrance">

                <p>Fragrance</p>

            </div>

            <!-- BODY CARE -->
            <div class="category-card" data-category="bodycare">

                <img src="../images/bodycare.jpeg" alt="Body Care">

                <p>Body Care</p>

            </div>

            <!-- LIPS -->
            <div class="category-card" data-category="lips">

                <img src="../images/lips.jpeg" alt="Lip Products">

                <p>Lips</p>

            </div>

        </div>

    </section>


    <!-- ================= BOOTSTRAP JS ================= -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- ================= JQUERY ================= -->

    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js">
    </script>

    <!-- ================= CUSTOM JAVASCRIPT ================= -->

    <script src="../js/script.js"></script>

</body>

</html>
