<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account | Mila</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Main Mila Navbar Styles -->
    <link rel="stylesheet" href="../css/style.css">
    <!-- Profile Page Styles -->
    <link rel="stylesheet" href="../css/profile.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar mila-navbar show-navbar">
        <div class="container-fluid">
            <a href="index.html" class="mila-logo">mila</a>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Shop</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>
            <div class="nav-actions">
                <a href="profile.html" class="account-link" aria-label="My Account" title="My Account">
                    <img src="../images/avatar.png" alt="" class="navbar-icon">
                </a>
                <a href="cart.html" class="cart-link">
                    <span class="cart-icon" aria-hidden="true">🛍</span>
                    <span class="cart-label">CART</span>
                    <span class="cart-count">0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- PROFILE CONTENT -->
    <main class="profile-page">
        <header class="profile-header">
            <div>
                <h1 id="welcomeHeading">My Account</h1>
                <p id="userEmailSub"></p>
            </div>
            <button type="button" class="btn-signout" id="signOutBtn">Sign Out</button>
        </header>

        <div class="profile-grid">
            <!-- PERSONAL INFORMATION -->
            <section class="profile-card">
                <h2>Personal Details</h2>
                <form id="profileForm">
                    <div class="form-group">
                        <label for="profEmail">Email Address</label>
                        <input type="email" id="profEmail" readonly>
                    </div>
                    <div class="form-group">
                        <label for="profName">Full Name</label>
                        <input type="text" id="profName" required>
                    </div>
                    <div class="form-group">
                        <label for="profPhone">Phone Number</label>
                        <input type="tel" id="profPhone" placeholder="e.g. +91 9876543210">
                    </div>
                    <div class="form-group">
                        <label for="profDob">Date of Birth</label>
                        <input type="date" id="profDob">
                    </div>
                    <button type="submit" class="btn-save" id="saveProfileBtn">Save Profile</button>
                    <div id="profileFeedback" class="card-feedback"></div>
                </form>
            </section>

            <!-- DELIVERY ADDRESS -->
            <section class="profile-card">
                <h2>Delivery Address</h2>
                <form id="addressForm">
                    <div class="form-group">
                        <label for="addrRecipient">Recipient Name</label>
                        <input type="text" id="addrRecipient" required>
                    </div>
                    <div class="form-group">
                        <label for="addrPhone">Phone Number</label>
                        <input type="tel" id="addrPhone" required>
                    </div>
                    <div class="form-group">
                        <label for="addrLine1">Address Line 1</label>
                        <input type="text" id="addrLine1" placeholder="Street address or P.O. Box" required>
                    </div>
                    <div class="form-group">
                        <label for="addrLine2">Address Line 2 (Optional)</label>
                        <input type="text" id="addrLine2" placeholder="Apartment, suite, unit, etc.">
                    </div>
                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label for="addrCity">City</label>
                            <input type="text" id="addrCity" required>
                        </div>
                        <div class="col-md-6 form-group">
                            <label for="addrState">State</label>
                            <input type="text" id="addrState" required>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6 form-group">
                            <label for="addrZip">Postal Code</label>
                            <input type="text" id="addrZip" required>
                        </div>
                        <div class="col-md-6 form-group">
                            <label for="addrCountry">Country</label>
                            <input type="text" id="addrCountry" value="India" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-save" id="saveAddressBtn">Save Address</button>
                    <div id="addressFeedback" class="card-feedback"></div>
                </form>
            </section>
        </div>

        <!-- ORDER HISTORY -->
        <section class="orders-section">
            <h2>Order History</h2>
            <div id="ordersContainer">
                <p style="color: #777;">Loading your past orders...</p>
            </div>
        </section>
    </main>

    <!-- SCRIPTS -->
    <script src="../js/cart-count.js"></script>
    <script src="../js/auth-nav.js"></script>
    <script>
        const API_BASE = "http://127.0.0.1:8000";

        document.addEventListener("DOMContentLoaded", async function () {
            const token = localStorage.getItem("milaAuthToken");
            if (!token) {
                window.location.href = "signin.html?redirect=profile.html";
                return;
            }

            const headers = {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${token}`
            };

            // Sign out
            document.getElementById("signOutBtn").addEventListener("click", () => {
                logout();
            });

            // 1. Fetch Profile
            try {
                const pRes = await fetch(`${API_BASE}/profile`, { headers });
                if (pRes.status === 401) {
                    logout();
                    return;
                }
                const profile = await pRes.json();
                document.getElementById("welcomeHeading").textContent = `Hello, ${profile.full_name}`;
                document.getElementById("userEmailSub").textContent = profile.email;
                document.getElementById("profEmail").value = profile.email;
                document.getElementById("profName").value = profile.full_name || "";
                document.getElementById("profPhone").value = profile.phone_number || "";
                if (profile.date_of_birth) {
                    document.getElementById("profDob").value = profile.date_of_birth;
                }
            } catch (err) {
                console.error("Profile load error:", err);
            }

            // Save Profile
            document.getElementById("profileForm").addEventListener("submit", async (e) => {
                e.preventDefault();
                const feedback = document.getElementById("profileFeedback");
                feedback.textContent = "";
                feedback.className = "card-feedback";

                const fullName = document.getElementById("profName").value.trim();
                const phone = document.getElementById("profPhone").value.trim();
                const dob = document.getElementById("profDob").value || null;

                try {
                    const res = await fetch(`${API_BASE}/profile`, {
                        method: "PUT",
                        headers,
                        body: JSON.stringify({ full_name: fullName, phone_number: phone, date_of_birth: dob })
                    });
                    const updated = await res.json();
                    if (!res.ok) throw new Error(updated.detail || "Update failed");

                    feedback.textContent = "Profile updated successfully!";
                    feedback.classList.add("success");
                    document.getElementById("welcomeHeading").textContent = `Hello, ${updated.full_name}`;

                    // Update stored user object
                    const user = getAuthUser();
                    if (user) {
                        user.full_name = updated.full_name;
                        localStorage.setItem("milaUser", JSON.stringify(user));
                    }
                } catch (err) {
                    feedback.textContent = err.message;
                    feedback.classList.add("error");
                }
            });

            // 2. Fetch Address
            try {
                const aRes = await fetch(`${API_BASE}/addresses`, { headers });
                if (aRes.ok) {
                    const addr = await aRes.json();
                    document.getElementById("addrRecipient").value = addr.recipient_name || "";
                    document.getElementById("addrPhone").value = addr.phone_number || "";
                    document.getElementById("addrLine1").value = addr.address_line1 || "";
                    document.getElementById("addrLine2").value = addr.address_line2 || "";
                    document.getElementById("addrCity").value = addr.city || "";
                    document.getElementById("addrState").value = addr.state || "";
                    document.getElementById("addrZip").value = addr.postal_code || "";
                    document.getElementById("addrCountry").value = addr.country || "India";
                }
            } catch (err) {
                console.error("Address load error:", err);
            }

            // Save Address
            document.getElementById("addressForm").addEventListener("submit", async (e) => {
                e.preventDefault();
                const feedback = document.getElementById("addressFeedback");
                feedback.textContent = "";
                feedback.className = "card-feedback";

                const payload = {
                    recipient_name: document.getElementById("addrRecipient").value.trim(),
                    phone_number: document.getElementById("addrPhone").value.trim(),
                    address_line1: document.getElementById("addrLine1").value.trim(),
                    address_line2: document.getElementById("addrLine2").value.trim() || null,
                    city: document.getElementById("addrCity").value.trim(),
                    state: document.getElementById("addrState").value.trim(),
                    postal_code: document.getElementById("addrZip").value.trim(),
                    country: document.getElementById("addrCountry").value.trim() || "India"
                };

                try {
                    const res = await fetch(`${API_BASE}/addresses`, {
                        method: "POST",
                        headers,
                        body: JSON.stringify(payload)
                    });
                    const saved = await res.json();
                    if (!res.ok) throw new Error(saved.detail || "Saving address failed");

                    feedback.textContent = "Address saved successfully!";
                    feedback.classList.add("success");
                } catch (err) {
                    feedback.textContent = err.message;
                    feedback.classList.add("error");
                }
            });

            // 3. Fetch Orders
            try {
                const oRes = await fetch(`${API_BASE}/orders`, { headers });
                const ordersContainer = document.getElementById("ordersContainer");
                if (oRes.ok) {
                    const orders = await oRes.json();
                    if (orders.length === 0) {
                        ordersContainer.innerHTML = `
                            <p style="color: #777;">You have not placed any orders yet.</p>
                            <a href="products.html" style="color: #8bbbc9; text-decoration: underline;">Start Shopping</a>
                        `;
                    } else {
                        ordersContainer.innerHTML = "";
                        orders.forEach(order => {
                            const dateStr = new Date(order.created_at).toLocaleDateString("en-IN", {
                                year: "numeric", month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"
                            });
                            const itemsList = order.items.map(it => `
                                <li><strong>${it.product_name}</strong> × ${it.quantity} (₹${Number(it.unit_price).toLocaleString("en-IN")} each)</li>
                            `).join("");

                            const card = document.createElement("div");
                            card.className = "order-item-card";
                            card.innerHTML = `
                                <div class="order-item-header">
                                    <span>Order #${order.order_id} &bull; <small style="color: #666; font-weight: normal;">${dateStr}</small></span>
                                    <span class="order-badge">${order.order_status}</span>
                                </div>
                                <div style="font-size: 13px; color: #555; margin-bottom: 6px;">
                                    <strong>Shipped to:</strong> ${order.recipient_name}, ${order.address_line1}, ${order.city}, ${order.state} ${order.postal_code}
                                </div>
                                <ul class="order-products">
                                    ${itemsList}
                                </ul>
                                <div class="order-footer">
                                    <span>Payment: <em>Simulated (Demonstration)</em></span>
                                    <strong>Total: ₹${Number(order.total_amount).toLocaleString("en-IN")}</strong>
                                </div>
                            `;
                            ordersContainer.appendChild(card);
                        });
                    }
                }
            } catch (err) {
                console.error("Orders load error:", err);
            }
        });
    </script>
</body>
</html>
