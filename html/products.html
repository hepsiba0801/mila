<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mila | Products</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Products Page CSS -->
    <link rel="stylesheet" href="../css/products.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar mila-navbar show-navbar">

        <div class="container-fluid">

            <!-- Logo -->
            <a href="index.html" class="mila-logo">mila</a>

            <!-- Navigation Links -->
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Shop</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>

            <!-- Account and Cart -->
            <div class="nav-actions">

                <!-- Account -->
                <a
                    href="signin.html"
                    class="account-link"
                    aria-label="My Account"
                    title="My Account"
                >
                    <img
                        src="../images/avatar.png"
                        alt=""
                        class="navbar-icon"
                    >
                </a>

                <!-- Cart -->
                <a href="cart.html" class="cart-link">
                    <span class="cart-icon" aria-hidden="true">🛍</span>
                    <span class="cart-label">CART</span>
                    <span class="cart-count">0</span>
                </a>

            </div>

        </div>

    </nav>


    <!-- ================= PRODUCTS PAGE ================= -->

    <main class="products-page">

        <!-- Category Heading -->
        <div class="products-header">

            <p class="products-small-title">
                MILA COSMETICS
            </p>

            <!-- Updated dynamically by products.js -->
            <h1 id="category-title">Products</h1>

            <p id="category-description">
                Discover our collection.
            </p>

        </div>

        <!-- Product Cards -->
        <div id="product-container">
            <!-- products.js generates product cards here -->
        </div>

    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <!-- Product data and filtering -->
    <script src="../js/products.js"></script>

    <!-- Shared cart count -->
    <script src="../js/cart-count.js"></script>

</body>

</html>
