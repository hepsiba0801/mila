<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mila | Product</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Product CSS -->
    <link rel="stylesheet" href="../css/product.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar mila-navbar show-navbar">

        <div class="container-fluid">

            <!-- Logo -->
            <a href="index.html" class="mila-logo">mila</a>

            <!-- Navigation Links -->
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Shop</a>
                <a href="about.html">About</a>
                <a href="contact.html">Contact</a>
            </div>

            <!-- Account and Cart -->
            <div class="nav-actions">

                <!-- Sign In -->
                <a
                    href="signin.html"
                    class="account-link"
                    aria-label="My Account"
                    title="My Account"
                >
                    <img
                        src="../images/avatar.png"
                        alt=""
                        class="navbar-icon"
                    >
                </a>

                <!-- Shopping Cart -->
                <a href="cart.html" class="cart-link">
                    <span class="cart-icon" aria-hidden="true">🛍</span>
                    <span class="cart-label">CART</span>
                    <span class="cart-count">0</span>
                </a>

            </div>

        </div>

    </nav>


    <!-- ================= PRODUCT DETAILS ================= -->

    <main class="product-page">

        <div class="product-details">

            <!-- Product Image -->
            <div class="product-detail-image">
                <img
                    id="product-image"
                    src=""
                    alt="Product"
                >
            </div>

            <!-- Product Information -->
            <div class="product-detail-info">

                <!-- Category -->
                <p id="product-category" class="product-category"></p>

                <!-- Product Name -->
                <h1 id="product-name">Product Name</h1>

                <!-- Product Price -->
                <p id="product-price" class="product-price"></p>

                <!-- Divider -->
                <div class="product-line"></div>

                <!-- Description -->
                <h3>Description</h3>

                <p
                    id="product-description"
                    class="product-description"
                ></p>

                <!-- Quantity -->
                <div class="quantity-section">

                    <p>Quantity</p>

                    <div class="quantity-control">

                        <button
                            type="button"
                            id="decrease-btn"
                            aria-label="Decrease quantity"
                        >−</button>

                        <span id="quantity">1</span>

                        <button
                            type="button"
                            id="increase-btn"
                            aria-label="Increase quantity"
                        >+</button>

                    </div>

                </div>

                <!-- Add to Cart -->
                <button
                    type="button"
                    id="add-to-cart-btn"
                    class="add-to-cart-btn"
                >
                    ADD TO CART
                </button>

            </div>

        </div>

    </main>


    <!-- ================= JAVASCRIPT ================= -->

    <!-- Product data must load first -->
    <script src="../js/products.js"></script>

    <!-- Product details and quantity functionality -->
    <script src="../js/product.js"></script>

    <!-- Shared cart count -->
    <script src="../js/cart-count.js"></script>

</body>

</html>
